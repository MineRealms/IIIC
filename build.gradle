buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = maven_group
archivesBaseName = archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'improvedmobs'

            mods {
                improvedmobs {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'improvedmobs'

            mods {
                improvedmobs {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--all', '--mod', 'improvedmobs', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                improvedmobs {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url = "https://maven.gtceu.com" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.virtuoel.com" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.saps.dev/releases" }
    maven { url = "https://maven.blazing-coop.net/releases" }
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://maven.firstdarkdev.xyz/snapshots" }
    maven { url = "https://maven.tterrag.com/" }
    maven { url = "https://modmaven.dev" }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("io.github.flemmli97:tenshilib:${tenshilib_version}-forge")
    runtimeOnly fg.deobf("curse.maven:mobbattle-268746:6456884")
    compileOnly fg.deobf("${scalhealth_dep}")

  //  implementation fg.deobf("mezz.jei:jei-1.20.1-forge:15.3.0.4")
    implementation fg.deobf("mezz.jei:jei-1.20.1-forge:15.20.0.115")
    implementation fg.deobf("curse.maven:pehkui-319596:4684391")

    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-1.20.1:${gtceu_version}") { transitive = false }
    implementation fg.deobf("com.lowdragmc.ldlib:ldlib-forge-1.20.1:${ldlib_version}") { transitive = false }
   // implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }
    implementation fg.deobf("dev.toma.configuration:configuration-forge-1.20.1:${configuration_version}")
    
    // Spore (真菌孢子) API
    implementation fg.deobf("curse.maven:spore-678295:7881767")
}

mixin {
    add sourceSets.main, "improvedmobs.refmap.json"
    config "improvedmobs.mixins.json"
    config "improvedmobs.mixins.compat.json"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "improvedmobs",
                "Specification-Vendor"    : "flemmli97",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "flemmli97",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "improvedmobs.mixins.json,improvedmobs.mixins.compat.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
